name: Pages

on:
  push:
    branches: [main]
    paths: [README.md, policies/**, docs/**, site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy stonewall.sh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # README -> /, policies/ -> /policy/, docs/ -> /docs/ (logo), site/ -> / (anything else to serve).
      - name: Build site
        run: |
          mkdir -p _site/policy
          pandoc README.md -f gfm -t html5 -s --no-highlight --metadata pagetitle=Stonewall -c style.css -o _site/index.html
          cp policies/*.yml _site/policy/
          cp -r docs _site/
          cp -r site/. _site/

      - uses: actions/upload-pages-artifact@v3

      - id: deploy
        uses: actions/deploy-pages@v4
