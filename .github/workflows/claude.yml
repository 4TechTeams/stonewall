name: Claude

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json --strict

      - name: Marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      - name: Skills
        run: claude plugin validate skills --strict

      - name: Install smoke test
        shell: bash
        run: |
          set -euo pipefail
          claude plugin marketplace add ./
          claude plugin install stonewall@stonewall -y
          details=$(claude plugin details stonewall)
          echo "$details"
          echo "$details" | grep -qE '(Commands|Skills) \([1-9][0-9]*\).*\breview\b'
