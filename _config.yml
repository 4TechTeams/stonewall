# GitHub Pages: https://stonewall.sh serves README.md as the front page and policy/*.yml as files.
title: Stonewall
description: Force applied security guardrails for coding agents
theme: jekyll-theme-primer
kramdown:
  parse_block_html: true  # the README wraps its header in <div align="center">; render the markdown inside
exclude: ["*.go", go.mod, go.sum, internal, test, Makefile, LICENSE, v2-product-brief.md]
defaults:
  - scope: { path: README.md }
    values: { title: Stonewall }  # same as site.title, so the theme does not add its own heading above the README
